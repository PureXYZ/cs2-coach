name: Deploy

on:
  push:
    branches: [main]

# One deploy at a time; a second merge waits for the first to finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Gate the deploy on a green typecheck + sim — a red build never ships.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run sim

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to host over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Fail loudly on a misconfigured repo — without this, a missing
          # secret surfaces as a cryptic SSH error far downstream.
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_HOST" ]; then echo "ERROR: DEPLOY_SSH_KEY and/or DEPLOY_HOST repository secrets are not set"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The key is locked to a forced command on the host (restrict,command=
          # "/root/deploy.sh" in authorized_keys), so this can only ever deploy.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" deploy
